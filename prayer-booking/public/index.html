<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Book a Prayer Slot – Shalom Church</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header><strong>Shalom Church</strong><a class="back" href="/">← Back to website</a></header>
<main>
  <h1>Book a Personal Prayer 🙏</h1>
  <p class="sub">Choose an available time below. You'll get a confirmation and reminder on WhatsApp.</p>

  <div id="slots"><p class="empty">Loading available slots…</p></div>

  <form id="form" class="card hidden">
    <h2 style="margin-top:0">Your details</h2>
    <p id="chosen" class="msg ok" style="margin-top:0"></p>
    <div class="row">
      <div><label for="name">Name</label><input id="name" required maxlength="80" autocomplete="name"></div>
      <div><label for="phone">WhatsApp number</label><input id="phone" type="tel" required placeholder="e.g. 94003 28000" autocomplete="tel"></div>
    </div>
    <label for="req">Prayer request (optional)</label>
    <textarea id="req" rows="3" maxlength="500" placeholder="Share what you'd like us to pray for"></textarea>
    <button class="btn" id="go">Confirm booking</button>
    <div id="out"></div>
  </form>
</main>
<script>
let chosen = null;
const $ = (id) => document.getElementById(id);
const dayFmt = new Intl.DateTimeFormat('en-IN', {weekday:'long', day:'numeric', month:'long', timeZone:'Asia/Kolkata'});
const timeFmt = new Intl.DateTimeFormat('en-IN', {hour:'numeric', minute:'2-digit', hour12:true, timeZone:'Asia/Kolkata'});

async function load() {
  const list = await (await fetch('/api/slots')).json();
  const box = $('slots'); box.textContent = '';
  if (!list.length) { box.innerHTML = '<p class="empty">No slots are open right now. Please check back soon.</p>'; return; }
  let lastDay = '', grid;
  for (const s of list) {
    const day = dayFmt.format(s.start_ts);
    if (day !== lastDay) {
      const h = document.createElement('div'); h.className = 'day'; h.textContent = day; box.append(h);
      grid = document.createElement('div'); grid.className = 'grid'; box.append(grid); lastDay = day;
    }
    const b = document.createElement('button');
    b.className = 'slot'; b.disabled = s.left === 0;
    const t = document.createElement('b'); t.textContent = timeFmt.format(s.start_ts);
    const m = document.createElement('small');
    m.textContent = s.left === 0 ? 'Full' : `${s.duration_min} min · ${s.left} left`;
    b.append(t, m);
    if (s.note) { const n = document.createElement('small'); n.textContent = s.note; b.append(n); }
    b.onclick = () => {
      chosen = s; document.querySelectorAll('.slot').forEach(x => x.classList.remove('sel')); b.classList.add('sel');
      $('chosen').textContent = `Selected: ${day}, ${timeFmt.format(s.start_ts)}`;
      $('form').classList.remove('hidden'); $('form').scrollIntoView({behavior:'smooth'});
    };
    grid.append(b);
  }
}

$('form').onsubmit = async (e) => {
  e.preventDefault(); if (!chosen) return;
  $('go').disabled = true; $('out').textContent = '';
  try {
    const r = await fetch('/api/book', {method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({slotId: chosen.id, name: $('name').value, phone: $('phone').value, request: $('req').value})});
    const d = await r.json();
    if (!r.ok) throw new Error(d.error || 'Something went wrong.');
    $('form').innerHTML = '<h2 style="margin-top:0">✅ Booking confirmed</h2><p class="sub"></p><p>A confirmation has been sent to your WhatsApp.</p><a class="btn" href="/">Back to website</a>';
    $('form').querySelector('.sub').textContent = d.when;
    load();
  } catch (err) {
    const o = $('out'); o.className = 'msg err'; o.textContent = err.message; $('go').disabled = false; load();
  }
};
load();
</script>
</body>
</html>
