<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Admin – Prayer Slots</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Malayalam:wght@400;500;600&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<script src="i18n.js"></script>
<script src="admin-i18n.js"></script>
</head>
<body>
<header><strong data-i18n="aTitle"></strong><div class="hright"><a class="back opt" href="/" data-i18n="aView"></a><div class="lang"><button type="button" data-lang="en">EN</button><button type="button" data-lang="ml">മലയാളം</button></div></div></header>
<main class="page">
  <form id="login" class="card">
    <h2 style="margin-top:0" data-i18n="aLogin"></h2>
    <label for="pw" data-i18n="aPw"></label><input id="pw" type="password" required autocomplete="current-password">
    <button class="btn" data-i18n="aLoginBtn"></button><div id="lerr"></div>
  </form>

  <div id="app" class="hidden">
    <div class="tabs" role="tablist">
      <button type="button" data-tab="bookings" class="on" data-i18n="tabBookings"></button>
      <button type="button" data-tab="slots" data-i18n="tabSlots"></button>
    </div>

    <!-- BOOKINGS VIEW -->
    <section id="tab-bookings">
      <div class="stats">
        <div class="stat"><b id="stTotal">0</b><span data-i18n="sTotal"></span></div>
        <div class="stat"><b id="stToday">0</b><span data-i18n="sToday"></span></div>
        <div class="stat"><b id="stSlots">0</b><span data-i18n="sSlotsBooked"></span></div>
      </div>
      <div class="seg"><button type="button" data-seg="up" class="on" data-i18n="sUpcoming"></button><button type="button" data-seg="past" data-i18n="sPast"></button></div>
      <div id="bkList"></div>
    </section>

    <!-- MANAGE SLOTS -->
    <section id="tab-slots" class="hidden">
      <form id="add" class="card">
        <h2 style="margin-top:0" data-i18n="addSlots"></h2>
        <div class="row">
          <div><label for="date" data-i18n="date"></label><input id="date" type="date" required></div>
          <div><label for="atimes" data-i18n="times"></label><input id="atimes" required data-i18n-ph="timesPh"></div>
        </div>
        <div class="row">
          <div><label for="dur" data-i18n="dur"></label><input id="dur" type="number" min="5" max="240" value="30"></div>
          <div><label for="cap" data-i18n="cap"></label><input id="cap" type="number" min="1" max="100" value="1"></div>
        </div>
        <div class="row">
          <div><label for="weeks" data-i18n="weeks"></label><input id="weeks" type="number" min="1" max="26" value="1"></div>
          <div><label for="note" data-i18n="note"></label><input id="note" maxlength="200" data-i18n-ph="notePh"></div>
        </div>
        <button class="btn" data-i18n="addBtn"></button><div id="aerr"></div>
      </form>
      <h2 data-i18n="slotsList"></h2>
      <div id="list"></div>
    </section>

    <button class="btn danger sm" id="logout" style="margin-top:30px" data-i18n="aLogout"></button>
  </div>
</main>
<script>
const $ = (id) => document.getElementById(id);
const mk = (tag, cls, txt) => { const e = document.createElement(tag); if (cls) e.className = cls; if (txt != null) e.textContent = txt; return e; };
const IST = 'Asia/Kolkata';
let token = ''; try { token = sessionStorage.getItem('adm') || ''; } catch {}
let slots = [], seg = 'up', lastMsg = null;

const F = {};
function mkFmt() {
  const L = locale();
  F.day = new Intl.DateTimeFormat(L, {weekday:'long', day:'numeric', month:'long', timeZone: IST});
  F.time = new Intl.DateTimeFormat(L, {hour:'numeric', minute:'2-digit', hour12:true, timeZone: IST});
  F.full = new Intl.DateTimeFormat(L, {weekday:'short', day:'numeric', month:'short', hour:'numeric', minute:'2-digit', hour12:true, timeZone: IST});
  F.key = new Intl.DateTimeFormat('en-CA', {timeZone: IST});
}
mkFmt();
const say = (el, text, ok) => { el.className = 'msg ' + (ok ? 'ok' : 'err'); el.textContent = text; };

async function api(path, opts = {}) {
  const r = await fetch(path, {...opts, headers: {'Content-Type':'application/json', Authorization:'Bearer ' + token}});
  const d = await r.json().catch(() => ({}));
  if (r.status === 401 && path !== '/api/admin/login') { logout(); throw new Error(t('aExpired')); }
  if (!r.ok) { const e = new Error(d.error || 'Error'); e.status = r.status; throw e; }
  return d;
}
function show(loggedIn) { $('login').classList.toggle('hidden', loggedIn); $('app').classList.toggle('hidden', !loggedIn); }
function logout() { token = ''; try { sessionStorage.removeItem('adm'); } catch {} show(false); }
$('logout').onclick = logout;

// two-step confirm without browser dialogs
function confirmBtn(btn, label, armedLabel, action) {
  btn.type = 'button'; btn.textContent = label;
  btn.onclick = async () => {
    if (btn.dataset.armed !== '1') { btn.dataset.armed = '1'; btn.textContent = armedLabel; setTimeout(() => { btn.dataset.armed = ''; btn.textContent = label; }, 4000); return; }
    btn.disabled = true; await action();
  };
}

document.querySelectorAll('.tabs button').forEach((b) => b.onclick = () => {
  document.querySelectorAll('.tabs button').forEach((x) => x.classList.toggle('on', x === b));
  $('tab-bookings').classList.toggle('hidden', b.dataset.tab !== 'bookings');
  $('tab-slots').classList.toggle('hidden', b.dataset.tab !== 'slots');
});
document.querySelectorAll('.seg button').forEach((b) => b.onclick = () => {
  seg = b.dataset.seg; document.querySelectorAll('.seg button').forEach((x) => x.classList.toggle('on', x === b)); renderBookings();
});

$('login').onsubmit = async (e) => {
  e.preventDefault();
  try {
    const d = await api('/api/admin/login', {method:'POST', body: JSON.stringify({password: $('pw').value})});
    token = d.token; try { sessionStorage.setItem('adm', token); } catch {} $('pw').value = ''; $('lerr').className = ''; $('lerr').textContent = ''; show(true); refresh();
  } catch (err) { say($('lerr'), err.status === 401 ? t('aWrongPw') : err.message); }
};

$('add').onsubmit = async (e) => {
  e.preventDefault();
  try {
    const times = $('atimes').value.split(',').map(s => s.trim()).filter(Boolean).map(s => /^\d:\d{2}$/.test(s) ? '0' + s : s);
    const d = await api('/api/admin/slots', {method:'POST', body: JSON.stringify({
      date: $('date').value, times, duration_min: $('dur').value, capacity: $('cap').value, repeatWeeks: $('weeks').value, note: $('note').value})});
    say($('aerr'), t('added', d.created), true); refresh();
  } catch (err) { say($('aerr'), err.message); }
};

async function refresh() { slots = await api('/api/admin/slots'); renderBookings(); renderSlots(); }

// ---------- bookings view ----------
function waLink(phone) { const a = mk('a', '', '+' + phone); a.href = 'https://wa.me/' + phone; a.target = '_blank'; a.rel = 'noopener'; a.title = t('chat'); return a; }

function renderBookings() {
  const withB = slots.filter((s) => s.bookings.length);
  const up = withB.filter((s) => !s.past).sort((a, b) => a.start_ts - b.start_ts);
  const past = withB.filter((s) => s.past).sort((a, b) => b.start_ts - a.start_ts);
  const todayKey = F.key.format(Date.now());
  $('stTotal').textContent = up.reduce((n, s) => n + s.bookings.length, 0);
  $('stToday').textContent = up.filter((s) => F.key.format(s.start_ts) === todayKey).reduce((n, s) => n + s.bookings.length, 0);
  $('stSlots').textContent = up.length;

  const list = seg === 'up' ? up : past; const box = $('bkList'); box.replaceChildren();
  if (!list.length) { box.append(mk('p', 'empty', seg === 'up' ? t('noBookings') : t('noPast'))); return; }
  let lastDay = '';
  for (const s of list) {
    const k = F.key.format(s.start_ts);
    if (k !== lastDay) { box.append(mk('div', 'dayh', F.day.format(s.start_ts))); lastDay = k; }
    const c = mk('div', 'bkcard'); if (s.past) c.style.opacity = .7;
    const head = mk('div', 'slothead');
    const left = mk('div'); left.append(mk('span', 'time-big', F.time.format(s.start_ts)), document.createTextNode(' '), mk('span', 'pill', `${t('people', s.bookings.length)} · ${s.duration_min} ${t('minShort')}` + (s.note ? ' · ' + s.note : '')));
    head.append(left); c.append(head);
    for (const b of s.bookings) {
      const r = mk('div', 'bk'); const who = mk('div', 'who');
      who.append(mk('b', '', b.name)); const sm = mk('small'); sm.append(t('phoneLbl') + ': ', waLink(b.phone)); who.append(sm);
      if (b.request) who.append(mk('div', 'reqtxt', '📝 ' + b.request));
      r.append(who);
      if (!s.past) {
        const x = mk('button', 'btn danger sm');
        confirmBtn(x, t('cancel'), t('confirmCancel'), async () => { await api('/api/admin/bookings/' + b.id, {method:'DELETE'}); refresh(); });
        x.title = t('confirmCancel'); r.append(x);
      }
      c.append(r);
    }
    box.append(c);
  }
}

// ---------- manage slots ----------
function renderSlots() {
  const upcoming = slots.filter((s) => !s.past).sort((a, b) => a.start_ts - b.start_ts);
  const all = [...upcoming, ...slots.filter((s) => s.past)];
  const box = $('list'); box.replaceChildren();
  if (!all.length) { box.append(mk('p', 'empty', t('noSlots'))); return; }
  for (const s of all) {
    const c = mk('div', 'card'); c.style.opacity = s.past ? .55 : 1;
    const head = mk('div', 'slothead');
    const info = mk('div'); info.append(mk('b', '', F.full.format(s.start_ts) + (s.note ? ' – ' + s.note : '')), document.createTextNode(' '),
      mk('span', 'pill', `${s.bookings.length}/${s.capacity} ${t('booked')} · ${s.duration_min} ${t('minShort')}`));
    const del = mk('button', 'btn danger sm');
    confirmBtn(del, t('delSlot'), s.bookings.length ? t('confirmDelSlotN', s.bookings.length) : t('confirmDelSlot'), async () => { await api('/api/admin/slots/' + s.id, {method:'DELETE'}); refresh(); });
    head.append(info, del); c.append(head); box.append(c);
  }
}

window.onLang = () => { mkFmt(); document.title = t('aTitle'); renderBookings(); renderSlots(); };
document.addEventListener('DOMContentLoaded', () => { document.title = t('aTitle'); });
if (token) { show(true); refresh().catch(() => show(false)); } else show(false);
</script>
</body>
</html>
